<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="riverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Hexagonal frame -->
  <polygon points="50,6 89,28 89,72 50,94 11,72 11,28" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linejoin="round" fill="none" filter="url(#glow)" />

  <!-- Bridge tower (central pillar) -->
  <line x1="48.5" y1="22" x2="48.5" y2="54" stroke="url(#brandGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="51.5" y1="22" x2="51.5" y2="54" stroke="url(#brandGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Bridge deck -->
  <line x1="18" y1="54" x2="82" y2="54" stroke="url(#brandGrad)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Cables - left side -->
  <line x1="48.5" y1="24" x2="22" y2="54" stroke="url(#brandGrad)" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  <line x1="48.5" y1="24" x2="30" y2="54" stroke="url(#brandGrad)" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  <line x1="48.5" y1="24" x2="38" y2="54" stroke="url(#brandGrad)" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  <line x1="48.5" y1="24" x2="44" y2="54" stroke="url(#brandGrad)" stroke-width="1" stroke-linecap="round" opacity="0.8" />

  <!-- Cables - right side -->
  <line x1="51.5" y1="24" x2="78" y2="54" stroke="url(#brandGrad)" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  <line x1="51.5" y1="24" x2="70" y2="54" stroke="url(#brandGrad)" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  <line x1="51.5" y1="24" x2="62" y2="54" stroke="url(#brandGrad)" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  <line x1="51.5" y1="24" x2="56" y2="54" stroke="url(#brandGrad)" stroke-width="1" stroke-linecap="round" opacity="0.8" />

  <!-- River - flowing S curve -->
  <path d="M22 62 Q30 68 38 64 Q46 60 52 66 Q58 72 66 68 Q74 64 80 70" stroke="url(#riverGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M25 66 Q32 72 40 68 Q48 64 54 70 Q60 76 68 72 Q76 68 82 74" stroke="url(#riverGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
</svg>
